# ============================================================
# 联邦训练配置
# ============================================================
federated:
  # 客户端数量
  num_clients: 10

  # 服务端通信轮数
  server_epochs: 50

  # 每轮每个客户端本地训练 epoch 数
  client_epochs: 1

  # 训练设备：auto / cuda / cuda:0 / cpu；auto 表示有 GPU 就用 GPU，否则用 CPU
  device: auto


# ============================================================
# 聚合配置
# ============================================================
aggregation:
  # 非专家参数聚合方法：sample_weighted / uniform
  non_expert_agg_method: sample_weighted

  # 专家参数聚合方法：
  # - sample_weighted
  # - uniform
  # - uoc_foga_expert_align
  # - uoc_foga_pism_expert_align
  expert_agg_method: uoc_foga_pism_expert_align


# ============================================================
# 输出与断点续训配置
# ============================================================
runtime:
  # 实验总输出目录；data/result/model 三个目录会由它自动派生
  save_root: ./save/default_exp

  # 是否从 checkpoint 断点续训
  resume: false

  # 续训 checkpoint：latest 表示读取 save_root/model/checkpoints/latest.pth，也可以写具体路径
  resume_checkpoint: latest

  # 是否使用内存传递客户端模型更新，避免每轮客户端模型写 pth 后再由服务端读取
  in_memory_client_updates: true

  # 全局测试评估频率：1 表示每轮评估
  eval_every: 1

  # 训练 checkpoint 保存频率：1 表示每轮保存
  checkpoint_every: 1

  # 内存更新模式下是否每轮额外保存 server.pth：true / false
  save_server_model_each_round: false

  # UOC 聚合后模型保留在训练设备直到评估结束：true / false
  keep_uoc_model_on_device_until_eval: true

  # client 端是否打印 expert usage 和分层 stats 详情：true / false
  client_log_detail: false

  # client 训练 CSV 记录频率：1 表示每轮记录，0 表示不记录
  record_client_result_every: 1

  # 是否缓存每个 client 的 train DataLoader：true / false
  cache_client_train_loaders: false


# ============================================================
# UOC-FOGA 配置
# ============================================================
uoc_foga:
  # 是否采集 UOC evidence：true / false
  uoc_foga_enabled: true

  # 每客户端采样数：正整数
  uoc_foga_samples_per_client: 64

  # 每类 query 样本上限：正整数
  uoc_foga_query_per_class: 4

  # 每 expert 最少 query 样本/类别数：正整数
  uoc_foga_min_query_samples_per_expert: 8
  uoc_foga_min_classes_per_expert: 2

  # 用 top1 路由构造 query：true（当前仅支持 true）
  uoc_foga_use_top1: true

  # 本地训练前采集：true / false
  uoc_foga_collect_before_train: true

  # 强制 expert 的 gate 模式：one（当前仅支持 one）
  uoc_foga_gate_mode: one

  # score 转权重方式：relu（当前仅支持 relu）
  uoc_foga_score_mode: relu

  # score 计算度量：cosine 保持旧行为，dot 使用内积
  uoc_foga_score_metric: cosine

  # 最少有效客户端数：正整数
  uoc_foga_min_valid_clients: 1

  # 是否打印完整 per-expert UOC 详情：true / false
  uoc_foga_log_detail: false

  # query 筛选模式：class_balanced_random 保持旧行为，expert_ratio_entropy 启用增强筛选
  uoc_foga_query_select_mode: expert_ratio_entropy

  # expert token 命中比例阈值；旧模式默认不额外过滤
  uoc_foga_min_expert_token_ratio: 0.05

  # 每个 class 内每个 client 最多保留多少样本；0 表示不限制
  uoc_foga_max_samples_per_client_per_class: 2

  # 增强筛选后 query 不足时是否回退到旧随机 class-balanced
  uoc_foga_query_fallback_to_random: true

  # PISM 输入维度：当前固定为 3
  uoc_foga_pism_input_dim: 3

  # PISM 隐层宽度：正整数
  uoc_foga_pism_hidden_size: 64

  # PISM dropout：0.0 - 1.0
  uoc_foga_pism_dropout: 0.0

  # PISM 学习率：正数
  uoc_foga_pism_lr: 0.003

  # PISM softmax 温度：正数
  uoc_foga_pism_tau: 1.0

  # 是否标准化 PISM 输入：true / false
  uoc_foga_pism_renorm_inputs: true

  # PISM 最少有效客户端数：正整数
  uoc_foga_pism_min_clients: 1


# ============================================================
# 数据集与数据划分配置
# ============================================================
data:
  # 数据集名称：支持 cifar10 / cifar100
  data_name: cifar10

  # 原始 CIFAR 数据保存目录
  data_path: ./data

  # DataLoader 每个 batch 的样本数
  batch_size: 32

  # 每个客户端至少分到的样本数
  min_datasize: 32

  # Dirichlet non-IID 划分参数，越小表示客户端数据越偏
  alpha: 0.1

  # 随机种子，控制数据划分和训练随机性
  seed: 1

  # 数据划分元信息文件名
  partition_meta_name: partition_meta.pt

  # 数据划分类别统计文件名
  partition_stats_name: partition_stats.json

  # DataLoader worker 数量；GPU 训练建议大于 0
  num_workers: 4

  # GPU 训练时建议开启 pin_memory，加快 CPU 到 GPU 的数据拷贝
  pin_memory: true

  # 每个 worker 预取 batch 数；仅 num_workers > 0 时生效
  prefetch_factor: 2



# ============================================================
# 模型主干配置
# ============================================================
model:
  # 模型类型，目前使用 hybrid_switch_transformer
  model_type: hybrid_switch_transformer

  # 图像 backbone：cnn_stem / resnet18
  backbone_type: resnet18

  # dropout 概率
  dropout: 0.2

  # 客户端本地训练学习率
  learning_rate: 0.0005

  # 梯度裁剪阈值：1.0 保持旧行为，0 或负数表示跳过
  grad_clip_norm: 1.0

  # optimizer.zero_grad 是否使用 set_to_none=True：true / false
  optimizer_zero_grad_set_to_none: true

  # Transformer token embedding 维度
  embed_dim: 128

  # Transformer 多头注意力 head 数
  num_heads: 4

  # Transformer MLP 扩张倍率
  mlp_ratio: 4.0

  # Transformer block 深度
  depth: 4

  # 兼容旧配置字段；为空时使用 depth
  num_layers: null

  # CNN stem 输出通道数，仅 cnn_stem backbone 使用
  stem_channels: 64

  # token pooling 后的空间网格大小
  token_grid_size: 8

  # 是否使用 cls token
  use_cls_token: false


# ============================================================
# MoE / Router 配置
# ============================================================
moe:
  # expert 数量
  num_experts: 8

  # 哪些 Transformer 层使用 MoE FFN，例如 "1,3"
  moe_layers: "1,3"

  # router 选择 top-k expert
  top_k: 1

  # router auxiliary loss 系数
  router_aux_loss_coef: 0.01

  # router z-loss 系数
  router_z_loss_coef: 0.001

  # router jitter noise，0 表示关闭
  router_jitter_noise: 0.0

  # expert capacity 系数
  capacity_factor: 1.25

  # 每个 expert 的最小 capacity
  min_capacity: 4

  # 超过 capacity 的 token 是否丢弃
  drop_tokens: true
