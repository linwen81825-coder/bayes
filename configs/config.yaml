# ============================================================
# 联邦训练配置
# ============================================================
federated:
  # 客户端数量
  num_clients: 10

  # 服务端通信轮数
  server_epochs: 100

  # 每轮每个客户端本地训练 epoch 数
  client_epochs: 1

  # 训练设备：auto / cuda / cuda:0 / cpu
  device: auto


# ============================================================
# 聚合配置
# ============================================================
aggregation:
  # 非专家参数聚合方法：sample_weighted / uniform
  non_expert_agg_method: sample_weighted

  # 专家参数聚合方法：
  # - sample_weighted
  # - uniform
  # - uoc_foga_expert_align
  # - uoc_foga_pism_expert_align
  #
  # 这里跑 9942508 版本的 PISM：
  # PISM 用 UOC-FOGA score 作为监督信号更新元网络。
  expert_agg_method: sample_weighted


# ============================================================
# 输出与断点续训配置
# ============================================================
runtime:
  # 单独保存这组实验，别覆盖 fedavg
  save_root: ./save/server_query_avg

  # 第一次跑建议 false
  resume: false

  resume_checkpoint: latest

  # 使用内存传递客户端更新
  in_memory_client_updates: true

  # 每轮评估
  eval_every: 1

  # 每轮保存 checkpoint
  checkpoint_every: 1

  save_server_model_each_round: false

  keep_uoc_model_on_device_until_eval: true

  client_log_detail: false

  record_client_result_every: 1

  cache_client_train_loaders: false

  deterministic: true

  deterministic_warn_only: true

  cublas_workspace_config: ":4096:8"


# ============================================================
# UOC-FOGA / PISM 配置
# ============================================================
uoc_foga:
  # 仍然启用 UOC-FOGA / PISM-score 聚合逻辑
  uoc_foga_enabled: true

  # 关键：
  # 客户端不再从本地 train_loader 采集 evidence query。
  uoc_foga_collect_before_train: false

  # 关键：
  # query 来源改成服务端 server_query。
  # server_query 是从 official test set 中划出来的。
  uoc_foga_query_select_mode: server_query

  # 从 official test set 中划多少张作为 server query set。
  # CIFAR10 test set 共 10000 张，这里划 1000 张 query，剩下 9000 张 global_test。
  uoc_foga_server_query_size: 1000

  # 类别均衡划分，CIFAR10 下就是每类 100 张。
  uoc_foga_server_query_balanced: true

  # server query set 的独立随机种子偏移。
  uoc_foga_server_query_seed_offset: 9100

  # ------------------------------------------------------------
  # UOC-FOGA query / score 参数
  # ------------------------------------------------------------

  # 这个在 server_query 模式下主要保留兼容；
  # 客户端已经不采 evidence，但部分旧代码可能还会读取这个字段。
  uoc_foga_samples_per_client: 64

  # 每类 query 样本上限
  uoc_foga_query_per_class: 10

  # 每 expert 最少 query 样本/类别数
  uoc_foga_min_query_samples_per_expert: 32
  uoc_foga_min_classes_per_expert: 4

  # 用 top1 路由构造 query
  uoc_foga_use_top1: true

  # 强制 expert 的 gate 模式
  uoc_foga_gate_mode: one

  # score 转权重方式：relu / softmax
  uoc_foga_score_mode: relu

  # FOGA score softmax 温度
  uoc_foga_score_tau: 1.0

  # score 计算度量：cosine / dot
  uoc_foga_score_metric: cosine

  # 最少有效客户端数
  uoc_foga_min_valid_clients: 1

  # 是否打印完整 per-expert UOC 详情
  uoc_foga_log_detail: false

  # expert token 命中比例阈值
  uoc_foga_min_expert_token_ratio: 0.01

  # 每个 class 内每个 client 最多保留多少样本
  uoc_foga_max_samples_per_client_per_class: 0

  # query 不足时是否回退
  uoc_foga_query_fallback_to_random: true

  # ------------------------------------------------------------
  # PISM 元网络配置
  # ------------------------------------------------------------

  # 9942508 这个版本的 PISM 是 3 维输入：
  # client_loss + expert_usage + delta_norm
  # 不要改成 2。
  uoc_foga_pism_input_dim: 3

  # PISM 隐层宽度
  uoc_foga_pism_hidden_size: 64

  # PISM dropout
  uoc_foga_pism_dropout: 0.0

  # PISM 学习率
  uoc_foga_pism_lr: 0.003

  # PISM softmax 温度
  uoc_foga_pism_tau: 1.0

  # 是否标准化 PISM 输入
  uoc_foga_pism_renorm_inputs: true

  # PISM 最少有效客户端数
  uoc_foga_pism_min_clients: 1


# ============================================================
# 数据集与数据划分配置
# ============================================================
data:
  # 数据集名称：cifar10 / cifar100
  data_name: cifar10

  # 原始 CIFAR 数据保存目录
  data_path: ./data

  # DataLoader batch size
  batch_size: 64

  # 每个客户端至少分到的样本数
  min_datasize: 32

  # Dirichlet non-IID 参数
  alpha: 0.1

  # 随机种子
  seed: 1

  # 数据划分元信息文件名
  partition_meta_name: partition_meta.pt

  # 数据划分类别统计文件名
  partition_stats_name: partition_stats.json

  # 先设成 0，避免之前那个 pin_memory thread 报错
  num_workers: 0

  # 先关闭 pin_memory
  pin_memory: false

  # num_workers=0 时基本不会用到，保留即可
  prefetch_factor: 2


# ============================================================
# 模型主干配置
# ============================================================
model:
  # 模型类型
  model_type: hybrid_switch_transformer

  # 图像 backbone：cnn_stem / resnet18
  backbone_type: resnet18

  # dropout 概率
  dropout: 0.2

  # 客户端本地训练学习率
  learning_rate: 0.0005

  # 梯度裁剪阈值
  grad_clip_norm: 1.0

  # optimizer.zero_grad 是否使用 set_to_none=True
  optimizer_zero_grad_set_to_none: true

  # Transformer token embedding 维度
  embed_dim: 128

  # Transformer 多头注意力 head 数
  num_heads: 4

  # Transformer MLP 扩张倍率
  mlp_ratio: 4.0

  # Transformer block 深度
  depth: 4

  # 兼容旧配置字段；为空时使用 depth
  num_layers: null

  # CNN stem 输出通道数
  stem_channels: 64

  # token pooling 后的空间网格大小
  token_grid_size: 8

  # 是否使用 cls token
  use_cls_token: false


# ============================================================
# MoE / Router 配置
# ============================================================
moe:
  # expert 数量
  num_experts: 8

  # 哪些 Transformer 层使用 MoE FFN，例如 "1,3"
  moe_layers: "1,3"

  # router 选择 top-k expert
  top_k: 1

  # router auxiliary loss 系数
  router_aux_loss_coef: 0.01

  # router z-loss 系数
  router_z_loss_coef: 0.001

  # router jitter noise，0 表示关闭
  router_jitter_noise: 0.0

  # expert capacity 系数
  capacity_factor: 1.25

  # 每个 expert 的最小 capacity
  min_capacity: 4

  # 超过 capacity 的 token 是否丢弃
  drop_tokens: true